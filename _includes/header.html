---
---
<header class="site-header custom-site-header" role="banner">
  <div class="header-brand-row wrapper">
    <span class="brand-mark" aria-hidden="true">
      <span class="brand-mark-bar"></span>
      <span class="brand-mark-diamond"></span>
      <span class="brand-mark-dot"></span>
    </span>
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
  </div>

  <div class="header-menu-row wrapper">
    <nav class="site-nav" aria-label="Main navigation">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger" class="menu-toggle" aria-label="Toggle navigation">
        <span class="menu-lines" aria-hidden="true"><i></i><i></i><i></i></span>
      </label>
      <div class="trigger">
        {%- for path in site.header_pages -%}
          {%- assign my_page = site.pages | where: "path", path | first -%}
          {%- if my_page.title -%}
            <a class="page-link" href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a>
          {%- endif -%}
        {%- endfor -%}
      </div>
    </nav>
  </div>

  {%- if site.description -%}
    <p class="site-description">{{ site.description | escape }}</p>
  {%- endif -%}
</header>
